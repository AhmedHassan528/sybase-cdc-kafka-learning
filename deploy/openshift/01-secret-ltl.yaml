# UNTESTED TEMPLATE - no OpenShift cluster was available during this project. Validate with
#   oc apply --dry-run=server -f 01-secret-ltl.yaml
#
# Credentials RepAgent presents to the connector. The SAME values must be configured in ASE by the DBA:
#   sp_config_rep_agent <db>, 'enable', 'CDC_RS', '<username>', '<password>'
# Do not commit real values. Create the Secret from your secret store / sealed-secrets instead, e.g.
#   oc create secret generic sybase-cdc-ltl -n cdc --from-literal=username=... --from-literal=password=...
apiVersion: v1
kind: Secret
metadata:
  name: sybase-cdc-ltl
  namespace: cdc
type: Opaque
stringData:
  username: ${LTL_USERNAME}     # placeholder - replaced by your secret tooling
  password: ${LTL_PASSWORD}     # placeholder - keep <= 30 characters (longer is untested)
