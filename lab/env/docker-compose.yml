# Local lab: Sybase ASE -> Kafka Connect (our connector) -> Kafka, plus Kafka UI.
# Reproducible local lab, not a production deployment. Offline use on one machine is assumed.
# Images: pinned by digest (constitution, Technical Constraints), with the version tag kept where one exists.
# Evidence of what each pin resolves to: docs/evidence/20-image-versions.txt (regenerate: lab/env/verify-images.sh).
# Every published port is bound to 127.0.0.1 so nothing is reachable from other machines.
# The sa password is the public default of the ASE image; the lab accounts are created by lab/env/create-accounts.sh.
name: cdc-lab
# Container names use the cdc-lab- prefix so the lab never clashes with other containers on your machine.

services:
  sybase:
    # The only tag of this tested build is the 2019 'latest'; no immutable version tag exists for it. The newer '16.0' tag
    # (sha256:eaebcdaf...) is a different, untested build. See docs/evidence/20-image-versions.txt.
    image: datagrip/sybase@sha256:72f1e825d326f0c2ee9a10ea33e26e12aea6b6ff8a815d87abfb96f7e25d867f  # ASE 16.0 SP02 PL02 Developer Edition
    container_name: cdc-lab-sybase
    hostname: sybase
    ports: ["127.0.0.1:5000:5000"]
    environment:
      SYBASE_USER: sa
      SYBASE_PASSWORD: myPassword        # public image default for the sa login
      SYBASE_DB: phoenix_test
    volumes:
      - ../../sybase:/scripts:ro
    entrypoint: ["/bin/bash", "/scripts/start.sh"]
    stop_grace_period: 30s
    restart: unless-stopped
    security_opt: ["seccomp=unconfined"]   # local test database only (see handbook, Docker chapter)

  kafka:
    image: apache/kafka:3.8.0@sha256:c89f315cff967322c5d2021434b32271393cb193aa7ec1d43e97341924e57069
    container_name: cdc-lab-kafka
    hostname: kafka
    ports: ["127.0.0.1:29092:29092"]
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_LISTENERS: PLAINTEXT://:9092,CONTROLLER://:9093,PLAINTEXT_HOST://:29092
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:9092,PLAINTEXT_HOST://localhost:29092
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: PLAINTEXT:PLAINTEXT,CONTROLLER:PLAINTEXT,PLAINTEXT_HOST:PLAINTEXT
      KAFKA_INTER_BROKER_LISTENER_NAME: PLAINTEXT
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka:9093
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: 0
    healthcheck:
      test: ["CMD-SHELL", "/opt/kafka/bin/kafka-broker-api-versions.sh --bootstrap-server kafka:9092 >/dev/null 2>&1"]
      interval: 5s
      timeout: 10s
      retries: 20

  connect:
    build:
      context: ../..
      dockerfile: deploy/docker/Dockerfile.connect
    image: sybase-cdc-connect:0.1.0
    container_name: cdc-lab-connect
    hostname: connect                      # the ASE interfaces entry CDC_RS points here
    restart: on-failure:5                  # at startup Connect can fail once to resolve "kafka"; Docker then starts it again
    ports: ["127.0.0.1:8083:8083"]   # 11752 (LTL) is reached only through the compose network
    depends_on:
      kafka: {condition: service_healthy}
      sybase: {condition: service_started}
    volumes:
      - ../../plugins:/opt/connectors:rw   # plugin.path; increment 6 drops your own JAR here

  kafka-ui:
    image: provectuslabs/kafka-ui:v0.7.2@sha256:8f2ff02d64b0a7a2b71b6b3b3148b85f66d00ec20ad40c30bdcd415d46d31818
    container_name: cdc-lab-kafka-ui
    ports: ["127.0.0.1:8080:8080"]
    environment:
      KAFKA_CLUSTERS_0_NAME: local
      KAFKA_CLUSTERS_0_BOOTSTRAPSERVERS: kafka:9092
      KAFKA_CLUSTERS_0_KAFKACONNECT_0_NAME: connect
      KAFKA_CLUSTERS_0_KAFKACONNECT_0_ADDRESS: http://connect:8083
    depends_on:
      kafka: {condition: service_healthy}
